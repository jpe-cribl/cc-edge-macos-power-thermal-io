output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Sets index and sourcetype on a macOS battery sample from the exec source,
  derives battery health percent from max and design capacity, and flags
  health below 80 percent. Event telemetry, so the index is os.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: index
          value: "'os'"
        - name: sourcetype
          value: "'macos:power:battery'"
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: battery_health_percent
          value: "design_capacity > 0 ? Math.round(max_capacity / design_capacity * 1000) / 10 : undefined"
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        # Set only when health is below 80 percent; otherwise both fields stay unset.
        - name: anomaly
          value: "(battery_health_percent !== undefined && battery_health_percent < 80) ? true : undefined"
        - name: anomaly_reason
          value: "(battery_health_percent !== undefined && battery_health_percent < 80) ? 'battery_health_degraded' : undefined"
